<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Queen Charlotte Track 3D</title>
<meta name="theme-color" content="#071519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QC Track">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Newsreader:ital,opsz,wght@1,6..72,400..500&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: the sound at dusk. Glass panels float over a live 3D chart.
     Layout: full-screen map, status at the top, time bar and one sheet at the bottom. */
  color-scheme: dark;
  --night:#071519; --glass:rgba(8,25,30,.78); --glass-2:rgba(255,255,255,.065); --edge:rgba(190,232,222,.16);
  --text:#ecf4f0; --mute:#a5bcb6; --amber:#ffb454; --sea:#58d6c3; --warn:#ff7d5c; --rain:#74b9ff;
  --d1:#ffb454; --d2:#ff7d5c; --d3:#f472b6; --d4:#b79cff; --d5:#6fe0ff;
  --f-ui:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-chart:"Newsreader",Georgia,"Times New Roman",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--text);font:400 15px/1.4 var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* map markers */
.mk{position:absolute;left:0;top:0;will-change:transform}
.mk>*{position:absolute;transform:translate(-50%,-100%);white-space:nowrap}
.mk.stop>button{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 7px;border-radius:999px;background:rgba(8,25,30,.82);border:1px solid rgba(255,180,84,.55);font-weight:600;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.35);margin-top:-8px}
.mk.stop>button i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.mk.poi>button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;margin-top:4px}
.mk.poi svg{width:15px;height:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.mk.poi span{display:none;font-size:11px;font-weight:600;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);order:-1}
.mk.poi.close span,.mk.poi.sel span{display:block}
.mk.poi.sel svg{transform:scale(1.5)}
.mk.lab>span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(236,244,240,.78);text-shadow:0 1px 4px rgba(0,0,0,.75);text-align:center;transform:translate(-50%,-50%)}
.mk.lab.water>span{font:italic 400 14px/1.15 var(--f-chart);letter-spacing:.2em;text-transform:none;color:rgba(214,246,240,.82)}
.mk.lab.big>span{font-size:12.5px}.mk.lab.water.big>span{font-size:17px}
.mk.lab small{display:block;font-size:.8em;letter-spacing:.1em;opacity:.8}
.mk.me>span{margin-top:-14px;padding:2px 8px;border-radius:999px;background:#fff;color:#10252a;font-size:11px;font-weight:700}
.mk.moment>button{pointer-events:auto;width:16px;height:16px;transform:translate(-50%,-50%) rotate(45deg);background:var(--sea);border:2px solid #06262a;border-radius:3px}

/* top status */
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(10px + var(--sat)) 14px 26px;pointer-events:none;background:linear-gradient(rgba(4,16,20,.72),rgba(4,16,20,0))}
.hud>*{pointer-events:auto}
.eyebrow{font:italic 400 14px/1 var(--f-chart);letter-spacing:.06em;color:var(--sea)}
#dayTitle{font-size:20px;white-space:nowrap;line-height:1.1;font-weight:700;letter-spacing:-.01em;margin-top:4px;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.sub{color:var(--mute);font-size:13px;margin-top:3px;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud>div:first-child{min-width:0}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:14px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chip svg{width:26px;height:26px;color:var(--amber)}
.chip b{font-size:19px;font-weight:700;line-height:1}
.chip small{display:block;font-size:11px;color:var(--mute);line-height:1.15;text-align:left}
#compass{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#compass svg{width:24px;height:24px}
#locBtn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;color:var(--text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#locBtn svg{width:22px;height:22px}
#locBtn.on{background:#fff;color:#0c2227;border-color:#fff}

/* card for a place */
#card{position:fixed;left:12px;right:12px;bottom:calc(var(--sheet-h,300px) + 10px);max-width:520px;margin:0 auto;padding:13px 14px 14px;border-radius:16px;background:rgba(8,25,30,.93);border:1px solid var(--edge);box-shadow:0 10px 40px rgba(0,0,0,.45);z-index:5}
#card[hidden]{display:none}
#card .k{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#card .k svg{width:12px;height:12px}
#card h2{font-size:18px;font-weight:700;margin:4px 34px 5px 0;line-height:1.15}
#card p{font-size:14px;color:#d5e3de;user-select:text;-webkit-user-select:text}
#card .meta{color:var(--amber);font-size:12.5px;margin-top:7px;font-weight:600}
#cardClose{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--mute)}
#toast{position:fixed;left:50%;top:calc(96px + var(--sat));transform:translate(-50%,-12px);padding:9px 15px;border-radius:999px;background:#fff;color:#0c2227;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:6;max-width:86vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border-top:1px solid var(--edge);border-radius:20px 20px 0 0;padding-bottom:var(--sab);display:flex;flex-direction:column;z-index:4}
.timebar{padding:10px 14px 4px}
.tl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#timeLabel{font-weight:700;font-size:15px}
#timeWx{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right}
#liveBtn{flex:none;padding:3px 10px;border-radius:999px;border:1px solid var(--edge);font-size:12px;font-weight:600;color:var(--mute)}
#liveBtn.on{background:var(--sea);color:#04262a;border-color:transparent}
#scrub{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0 0;display:block;touch-action:pan-y}
#scrub::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--scrub-bg,#234) center/100% 100% no-repeat;border:1px solid var(--edge)}
#scrub::-moz-range-track{height:12px;border-radius:6px;background:var(--scrub-bg,#234) center/100% 100% no-repeat;border:1px solid var(--edge)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--amber);margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#scrub::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--amber)}
.ticks{display:flex;font-size:10.5px;color:var(--mute);margin-top:-3px}
.ticks span{flex:1;text-align:center;border-left:1px solid var(--edge)}
.ticks span:first-child{border-left:0}
.ticks span.trip{color:var(--text);font-weight:600}
.tabs{display:flex;padding:4px 8px 0;gap:2px}
.tabs button{flex:1;padding:9px 1px 10px;font-size:12.5px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;border-radius:8px 8px 0 0}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--amber)}
.panels{max-height:min(34vh,330px);overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--edge);-webkit-overflow-scrolling:touch}
.sheet[data-open="0"] .panels{display:none}
.panel{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.panel[hidden]{display:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:1 0 auto;min-width:62px;padding:7px 10px;border-radius:12px;background:var(--glass-2);border:1px solid transparent;text-align:left;line-height:1.15}
.pill b{display:block;font-size:13.5px}
.pill small{font-size:11.5px;color:var(--mute)}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.pill[aria-pressed="true"]{border-color:var(--edge);background:rgba(255,255,255,.14)}
.pill svg{width:20px;height:20px;display:block;margin:2px 0;color:var(--amber)}
h2.t{font-size:19px;font-weight:700;line-height:1.15}
h3.t{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.startrow{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute)}
.startrow input{background:rgba(255,255,255,.09);border:1px solid var(--edge);border-radius:10px;padding:6px 9px;font-size:15px;font-weight:600;color:var(--text)}
.stats>div{background:var(--glass-2);border-radius:12px;padding:8px 8px 7px;min-width:0}
.stats b{display:block;font-size:19px;font-weight:700;line-height:1.05;white-space:nowrap}
.stats span{font-size:11px;color:var(--mute)}
.stats input[type=time]{background:none;border:0;padding:0;margin:0;font-size:17px;line-height:1.2;font-weight:700;width:100%;min-width:0;color:var(--text);-webkit-appearance:none;appearance:none}
.stats input[type=time]::-webkit-calendar-picker-indicator{display:none}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:12px;background:rgba(88,214,195,.10);border:1px solid rgba(88,214,195,.22)}
.verdict.warn{background:rgba(255,125,92,.12);border-color:rgba(255,125,92,.4)}
.verdict svg{width:30px;height:30px;flex:none;color:var(--amber)}
.verdict b{display:block;font-size:14px}
.verdict span{font-size:13.5px;color:#d5e3de}
.profile{width:100%;height:auto;display:block;touch-action:pan-y}
.profile text{font:10px var(--f-ui);fill:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:12px;background:var(--glass-2);border:1px solid var(--edge);font-weight:600;font-size:13.5px}
.btn.pri{background:var(--amber);color:#2a1700;border-color:transparent}
.btn.sea{background:var(--sea);color:#04262a;border-color:transparent}
.btn.danger{color:var(--warn);border-color:rgba(255,125,92,.4)}
.btn:disabled{opacity:.45}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 2px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}
.list li:last-child button{border-bottom:0}
.list .km{width:46px;flex:none;color:var(--mute);font-size:12.5px;text-align:right}
.list svg{width:13px;height:13px;flex:none}
.list .nm{flex:1;font-weight:500;font-size:14px}
.list .away{color:var(--amber);font-size:12px;font-weight:600}
.tonight{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,180,84,.35);background:rgba(255,180,84,.08)}
.tonight b{color:var(--amber)}
.tonight p{font-size:13.5px;color:#d5e3de;margin-top:2px}
.fine{font-size:12px;color:var(--mute)}
.plan label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
select,.txt{background:rgba(255,255,255,.09);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;font-size:14px;max-width:62%}
.txt{max-width:none;flex:1;min-width:0;user-select:text;-webkit-user-select:text}
select option{color:#111}
.hours{display:flex;gap:0;overflow-x:auto;margin:0 -14px;padding:0 10px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:46px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;font-size:12px}
.hr.walk{background:rgba(255,255,255,.055)}
.hr.cur{outline:1.5px solid var(--amber)}
.hr svg{width:22px;height:22px;color:var(--amber)}
.hr.nt svg{color:#b9c8ff}
.hr b{font-size:14px}
.hr .bar{width:14px;height:26px;display:flex;align-items:flex-end;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.hr .bar i{display:block;width:100%;background:var(--rain)}
.hr .mm{color:var(--rain);font-size:10.5px;height:13px}
.hr .wd svg{width:13px;height:13px;color:var(--text)}
.hr .gu{color:var(--mute);font-size:10.5px}
.hr .gu.hi{color:var(--warn);font-weight:700}
.big{font-size:17px;font-weight:700;line-height:1.2}
.seg{display:inline-flex;background:var(--glass-2);border-radius:11px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--text)}
input[type=range].plain{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range].plain::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
input[type=range].plain::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
input[type=range].plain::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--amber);margin-top:-8px}
input[type=range].plain::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--amber);border:0}
.spot{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.spot button{display:flex;gap:9px;align-items:flex-start;text-align:left;padding:9px 10px;border-radius:12px;background:var(--glass-2);border:1px solid transparent;min-width:0}
.spot button i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--mute);margin-top:1px}
.spot button[aria-pressed="true"]{border-color:rgba(88,214,195,.5);background:rgba(88,214,195,.12)}
.spot button[aria-pressed="true"] i{background:var(--sea);border-color:var(--sea);box-shadow:inset 0 0 0 3px #0b2a2e}
.spot b{display:block;font-size:13.5px;line-height:1.15}
.spot small{font-size:11.5px;color:var(--mute);line-height:1.25;display:block;margin-top:2px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--amber)}
.bdg{width:15px;height:15px;flex:none;vertical-align:-3px;margin-right:3px}
.list .bd{display:inline-flex;gap:1px;margin-left:7px;vertical-align:-2px}
.list .bd .bdg{width:14px;height:14px;margin:0}
.list .km small{display:block;font-size:10.5px;color:var(--amber);line-height:1.1}
.notes{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:#d5e3de}
#card .notes{margin-top:4px}
.facrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;color:var(--mute)}
.facrow a.btn{text-decoration:none;color:var(--text)}.facrow a.btn.pri{color:#2a1700}
.boatrow.late span:last-child,.boatline.late{color:var(--warn);font-weight:600}
.boatline{font-size:13.5px;color:#d5e3de}
.hscroll{overflow-x:auto;margin:0 -14px;padding:0 0 4px;-webkit-overflow-scrolling:touch}
.profile.wide{display:block;max-width:none;touch-action:pan-x pan-y}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center}
#helpBtn{padding:6px 11px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,125,92,.55);color:#ffc9bb;font-size:12px;font-weight:700;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#card{max-height:46vh;overflow-y:auto}
@media (max-width:360px){.stats b{font-size:17px}.spot{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D map of the Queen Charlotte Track"></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="hud">
  <div>
    <p class="eyebrow">Queen Charlotte Track</p>
    <h1 id="dayTitle">Day 1</h1>
    <p class="sub" id="daySub"></p>
  </div>
  <div class="hud-r">
    <button class="chip" id="wxChip" aria-label="Open the forecast"></button>
    <button id="compass" aria-label="Turn the map north up">
      <svg viewBox="0 0 24 24" id="needle"><path d="M12 2.5 15.5 12h-7z" fill="#ff7d5c"/><path d="M12 21.5 8.5 12h7z" fill="#dfe9e6"/></svg>
    </button>
    <button id="locBtn" aria-label="Show my position on the map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
    </button>
    <button id="helpBtn" aria-label="Help and phone numbers">Help</button>
  </div>
</header>

<aside id="card" hidden>
  <button id="cardClose" aria-label="Close">×</button>
  <div class="k" id="cardKind"></div>
  <h2 id="cardTitle"></h2>
  <p id="cardText"></p>
  <div class="meta" id="cardMeta"></div>
</aside>
<div id="toast" role="status"></div>

<section class="sheet" id="sheet" data-open="1">
  <div class="timebar">
    <div class="tl"><button id="liveBtn" class="on">Now</button><span id="timeLabel" class="num"></span><span id="timeWx" class="num"></span></div>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Move through the forecast time">
    <div class="ticks" id="ticks"></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="days" aria-selected="true">Days</button>
    <button role="tab" data-tab="profile" aria-selected="false">Profile</button>
    <button role="tab" data-tab="sky" aria-selected="false">Weather</button>
    <button role="tab" data-tab="track" aria-selected="false">Track</button>
    <button role="tab" data-tab="spot" aria-selected="false">Spot</button>
    <button role="tab" data-tab="replay" aria-selected="false">Replay</button>
  </nav>
  <div class="panels" id="panels">
    <div class="panel" id="p-days"></div>
    <div class="panel" id="p-profile" hidden></div>
    <div class="panel" id="p-sky" hidden></div>
    <div class="panel" id="p-track" hidden></div>
    <div class="panel" id="p-spot" hidden></div>
    <div class="panel" id="p-replay" hidden></div>
  </div>
</section>
<script src="app.js"></script>
</body>
</html>
